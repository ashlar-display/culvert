[package]
name = "culvert-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hdmi-hal = { version = "0.6", default-features = false }

[dependencies.culvert]
path = ".."

[[bin]]
name = "status_flags"
path = "fuzz_targets/status_flags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ced"
path = "fuzz_targets/ced.rs"
test = false
doc = false
bench = false

# Prototype against hdmi-hal's unreleased breaking release, as in
# the crate's own manifest: a pushed commit of its feat/tmds-phy branch, moved by hand.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "35131adfe65067620e004665f6e2a88a4dbd6fb9" }
