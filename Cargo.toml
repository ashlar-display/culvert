[package]
name = "culvert"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "Typed access to the HDMI 2.1 SCDC register map"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/ashlar-display/culvert"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "scdc", "frl"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true

[features]
plumbob = ["dep:plumbob"]

[dependencies]
display-types = { version = ">=0.4.3, <0.6", default-features = false }
hdmi-hal = { version = "0.6", default-features = false }
plumbob = { optional = true, version = "0.4" }

[dev-dependencies]
hdmi-hal = { version = "0.6", default-features = false }

# Prototype against hdmi-hal's unreleased breaking release: pushed
# commits of hdmi-hal's feat/tmds-phy branch and of plumbob's feat/frl-phy, which builds on
# it (the `plumbob` feature), moved by hand. Removed when they are released.
[patch.crates-io]
hdmi-hal = { git = "https://github.com/ashlar-display/hdmi-hal", rev = "35131adfe65067620e004665f6e2a88a4dbd6fb9" }
plumbob = { git = "https://github.com/ashlar-display/plumbob", rev = "51419512bced9d6eb37eebe63ed5e61779c59e1d" }
